services:
  # Discovery service - manual one-time execution
  discovery:
    build:
      context: .
      target: development
    command: sh -c "cd ingestion/discovery && npx ts-node --project tsconfig.json src/index.ts"
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: password
      DB_DATABASE: ffxi_dev
      REDIS_URL: redis://redis:6379
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"
    networks:
      - default

networks:
  default:
    name: ffxi-crawler
    external: true